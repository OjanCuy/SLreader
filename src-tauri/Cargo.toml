[package]
name = "slreader"
version = "0.1.0"
description = "Read, screen, and extract data from journal PDFs for systematic literature reviews"
authors = ["OjanCuy"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name different from the binary name.
# Without it, Windows builds can fail: https://github.com/rust-lang/cargo/issues/8519
name = "slreader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri-plugin-dialog = "2"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
